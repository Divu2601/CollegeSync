{% extends "base.html" %}
{% block title %}500 Server Error - CampusBook{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="card p-5 mx-auto shadow-sm" style="max-width: 600px;">
        <i class="bi bi-gear-wide-connected text-danger display-1 mb-3"></i>
        <h2 class="fw-bold">Internal Server Error</h2>
        <p class="text-muted mb-4">An unexpected system error occurred while processing the transaction. Any database operations have been safely rolled back.</p>
        <div>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">Return Home</a>
        </div>
    </div>
</div>
{% endblock %}
