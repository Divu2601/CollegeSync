{% extends "base.html" %}
{% block title %}400 Bad Request - CampusBook{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="card p-5 mx-auto shadow-sm" style="max-width: 600px;">
        <i class="bi bi-exclamation-triangle-fill text-warning display-1 mb-3"></i>
        <h2 class="fw-bold">Invalid Request</h2>
        <p class="text-muted mb-4">{{ error.description if error and error.description else "Your request could not be processed due to invalid parameters or expired session." }}</p>
        <div>
            <a href="javascript:history.back()" class="btn btn-outline-primary px-4 me-2">Go Back</a>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">Home</a>
        </div>
    </div>
</div>
{% endblock %}
