{% extends "base.html" %}
{% block title %}403 Forbidden - CampusBook{% endblock %}
{% block content %}
<div class="container text-center py-5">
    <div class="card p-5 mx-auto shadow-sm" style="max-width: 600px;">
        <i class="bi bi-shield-x text-danger display-1 mb-3"></i>
        <h2 class="fw-bold">Access Restricted</h2>
        <p class="text-muted mb-4">{{ error.description if error and error.description else "You do not have permission to view or manage this resource." }}</p>
        <div>
            <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4 me-2">Back to Home</a>
            <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary px-4">Switch Account</a>
        </div>
    </div>
</div>
{% endblock %}
