{% extends "base.html" %}
{% block title %}Register &bull; CampusBook{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-sm-10">
            <div class="card-clean p-4 p-md-5">
                <div class="text-center mb-4">
                    <h4 class="fw-bold text-dark mb-1">Create an Account</h4>
                    <p class="text-muted small">Register to book college venues and organise events</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Priyanshu Sharma" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">College Email <span class="text-danger">*</span></label>
                        <input type="email" name="email" class="form-control" placeholder="name@pgdav.du.ac.in" required>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Password <span class="text-danger">*</span></label>
                            <input type="password" name="password" class="form-control" required minlength="6">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Confirm Password <span class="text-danger">*</span></label>
                            <input type="password" name="confirm_password" class="form-control" required minlength="6">
                        </div>
                    </div>

                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Role <span class="text-danger">*</span></label>
                            <select name="role" class="form-select" required>
                                <option value="Student" selected>Student</option>
                                <option value="Faculty">Faculty</option>
                                <option value="Society Coordinator">Society Coordinator</option>
                                <option value="Staff">Staff</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Department</label>
                            <select name="department_id" class="form-select">
                                <option value="">-- Select --</option>
                                {% for d in departments %}
                                <option value="{{ d.id }}">{{ d.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold text-secondary">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" placeholder="e.g. 9876543210">
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2">
                        Create Account
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-muted">
                    Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold text-decoration-none">Sign in here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
